<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>פתיחת ספרייה — אוצריא</title>
  <style>
    :root {
      color-scheme: light dark;
      --otz-primary: Highlight;
      --otz-surface: Canvas;
      --otz-surface-soft: Canvas;
      --otz-text: CanvasText;
      --otz-muted: GrayText;
      --otz-outline: GrayText;
      --otz-font: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 42px 24px 28px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: var(--otz-surface);
      color: var(--otz-text);
      font-family: var(--otz-font);
      text-align: right;
    }

    main {
      width: min(100%, 520px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 22px;
    }

    .intro {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .symbol {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
      color: var(--otz-primary);
      opacity: .88;
    }

    .symbol svg { width: 42px; height: 42px; display: block; }

    h1 {
      margin: 0 0 5px;
      font-size: 1.2rem;
      line-height: 1.4;
      font-weight: 600;
    }

    .intro p {
      margin: 0;
      color: var(--otz-muted);
      font-size: .94rem;
      line-height: 1.65;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 16px;
      border: 1px solid var(--otz-outline);
      border-color: color-mix(in srgb, var(--otz-outline) 34%, transparent);
      border-radius: 12px;
      background: var(--otz-surface-soft);
    }

    .setting-copy { min-width: 0; }

    .setting-title {
      display: block;
      margin-bottom: 3px;
      font-size: .98rem;
      font-weight: 550;
    }

    .setting-description {
      display: block;
      color: var(--otz-muted);
      font-size: .84rem;
      line-height: 1.5;
    }

    .switch {
      position: relative;
      flex: 0 0 46px;
      width: 46px;
      height: 27px;
      cursor: pointer;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--otz-outline);
      opacity: .55;
      transition: background .16s ease, opacity .16s ease;
    }

    .track::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: var(--otz-surface);
      box-shadow: 0 1px 2px #0002;
      transition: transform .16s ease;
    }

    .switch input:checked + .track {
      background: var(--otz-primary);
      opacity: 1;
    }

    .switch input:checked + .track::after { transform: translateX(-19px); }

    .switch input:focus-visible + .track {
      outline: 2px solid var(--otz-primary);
      outline-offset: 3px;
    }

    .switch input:disabled + .track { cursor: wait; opacity: .35; }

    #status {
      min-height: 1.3em;
      margin: -10px 2px 0;
      color: var(--otz-muted);
      font-size: .82rem;
    }

    footer {
      margin-top: 2px;
      color: var(--otz-muted);
      font-size: .82rem;
      opacity: .85;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro" aria-labelledby="title">
      <div class="symbol" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor"
             stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 17c-7-5-15-6-24-4v34c9-2 17-1 24 4 7-5 15-6 24-4V13c-9-2-17-1-24 4Z"/>
          <path d="M32 17v34M14 22c5-.5 10 .3 14 2M50 22c-5-.5-10 .3-14 2M14 31c5-.5 10 .3 14 2M50 31c-5-.5-10 .3-14 2"/>
        </svg>
      </div>
      <div>
        <h1 id="title">פתיחת ספרייה</h1>
        <p>גישה מהירה לספרייה המקורית של אוצריא.</p>
      </div>
    </section>

    <section class="setting" aria-label="הגדרות כפתור הפלוס">
      <div class="setting-copy">
        <span class="setting-title">הפעלת כפתור +</span>
        <span class="setting-description">כשהאפשרות פעילה, לחיצה על + תפתח את הספרייה.</span>
      </div>
      <label class="switch">
        <input id="plus-toggle" type="checkbox" role="switch" checked
               aria-label="הפעלת כפתור פלוס">
        <span class="track" aria-hidden="true"></span>
      </label>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <footer>יוצר התוסף: אברהם mch</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>

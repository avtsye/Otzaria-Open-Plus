<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>מוסיף+ — אוצריא</title>
  <style>
    :root {
      color-scheme: light dark;
      --color-primary: Highlight;
      --color-on-primary: Canvas;
      --color-surface: Canvas;
      --color-on-surface: CanvasText;
      --color-on-surface-variant: GrayText;
      --color-outline: GrayText;
      --color-outline-variant: GrayText;
      --color-surface-container-high: Canvas;
      --font-main: system-ui, sans-serif;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: var(--color-surface);
      color: var(--color-on-surface);
      font-family: var(--font-main);
      text-align: right;
    }
    .page-shell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: 76px 24px 68px;
    }
    .bsd {
      position: absolute;
      top: 24px;
      right: 28px;
      color: var(--color-on-surface-variant);
      font-size: .88rem;
      font-weight: 500;
      opacity: .82;
    }
    main {
      width: min(100%, 500px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 20px;
      margin: auto;
    }
    .intro { display: flex; align-items: center; gap: 15px; }
    .symbol {
      width: 46px; height: 46px; flex: 0 0 46px;
      display: grid; place-items: center;
      color: var(--color-primary); opacity: .82;
    }
    .symbol svg { width: 42px; height: 42px; display: block; }
    h1 { margin: 0 0 5px; font-size: 1.2rem; line-height: 1.4; font-weight: 600; }
    .intro p { margin: 0; color: var(--color-on-surface-variant); font-size: .94rem; line-height: 1.65; }
    .setting {
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; padding: 15px 16px;
      border: 1px solid var(--color-outline-variant);
      border-radius: var(--radius-md); background: transparent;
    }
    .setting-copy { min-width: 0; display: grid; gap: 4px; }
    .setting-title { display: block; font-size: .98rem; font-weight: 550; }
    .setting-description { display: block; color: var(--color-on-surface-variant); font-size: .84rem; line-height: 1.5; }
    select {
      max-width: 52%; min-width: 130px; padding: 8px 10px;
      color: var(--color-on-surface); background: var(--color-surface);
      border: 1px solid var(--color-outline-variant); border-radius: var(--radius-sm);
      font: inherit; font-size: .88rem;
    }
    .switch { position: relative; flex: 0 0 46px; width: 46px; height: 27px; cursor: pointer; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .track {
      position: absolute; inset: 0; border-radius: var(--radius-pill);
      background: var(--color-outline); opacity: .48;
      transition: background .16s ease, opacity .16s ease;
    }
    .track::after {
      content: ""; position: absolute; top: 4px; right: 4px;
      width: 19px; height: 19px; border-radius: 50%;
      background: var(--color-surface); transition: transform .16s ease;
    }
    .switch input:checked + .track { background: var(--color-primary); opacity: .9; }
    .switch input:checked + .track::after { transform: translateX(-19px); }
    .switch input:focus-visible + .track { outline: 2px solid var(--color-primary); outline-offset: 3px; }
    .switch input:disabled + .track { cursor: wait; opacity: .35; }
    #status { min-height: 1.3em; margin: -8px 2px 0; color: var(--color-on-surface-variant); font-size: .82rem; }
    .feedback {
      align-self: flex-start; padding: 8px 12px;
      color: var(--color-primary); background: transparent;
      border: 1px solid var(--color-outline-variant); border-radius: var(--radius-sm);
      font: inherit; font-size: .88rem; cursor: pointer;
    }
    .feedback:disabled { opacity: .5; cursor: wait; }
    footer {
      position: absolute; right: 24px; bottom: 20px; left: 24px;
      color: var(--color-on-surface-variant); font-size: .82rem;
      text-align: center; opacity: .82;
    }
    #handoff {
      position: fixed; inset: 0; z-index: 5;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px;
      background: color-mix(in srgb, var(--color-surface) 96%, var(--color-primary));
      color: var(--color-on-surface); text-align: center;
    }
    body.handoff-active #handoff { display: flex; }
    body.handoff-active .page-shell { visibility: hidden; }
    .handoff-label { color: var(--color-on-surface-variant); font-size: .95rem; letter-spacing: .02em; }
    .dots { display: inline-flex; gap: 3px; direction: ltr; }
    .dots span { opacity: 0; animation: dot-in-out 1.35s infinite; }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes dot-in-out { 0%, 15% { opacity: 0; } 35%, 65% { opacity: .85; } 85%, 100% { opacity: 0; } }
    .handoff-link {
      display: none; padding: 9px 14px;
      color: var(--color-on-primary); background: var(--color-primary);
      border-radius: var(--radius-md); text-decoration: none; font-size: .9rem;
    }
    .handoff-link[hidden] { display: none; }
    body.handoff-active .handoff-link:not([hidden]) { display: inline-flex; }
    @media (max-width: 420px) {
      .page-shell { padding-inline: 18px; }
      .bsd { top: 18px; right: 20px; }
      footer { bottom: 16px; }
    }
    @media (max-height: 420px) {
      .page-shell { padding-top: 58px; padding-bottom: 52px; }
      main { gap: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .dots span { opacity: .65; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="bsd" aria-label="בסייעתא דשמיא">בס״ד</div>
    <main>
      <section class="intro" aria-labelledby="title">
        <div class="symbol" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 17c-7-5-15-6-24-4v34c9-2 17-1 24 4 7-5 15-6 24-4V13c-9-2-17-1-24 4Z"/>
            <path d="M32 17v34M14 22c5-.5 10 .3 14 2M50 22c-5-.5-10 .3-14 2M14 31c5-.5 10 .3 14 2M50 31c-5-.5-10 .3-14 2"/>
          </svg>
        </div>
        <div>
          <h1 id="title">מוסיף+</h1>
          <p>גישה מהירה למסכים המרכזיים באוצריא.</p>
        </div>
      </section>
      <section class="setting" aria-label="הגדרות כפתור הפלוס">
        <div class="setting-copy">
          <span class="setting-title">הפעלת כפתור +</span>
          <span class="setting-description">הפעלת הכפתור והקצאתו לתוסף.</span>
        </div>
        <label class="switch">
          <input id="plus-toggle" type="checkbox" role="switch" checked aria-label="הפעלת כפתור פלוס">
          <span class="track" aria-hidden="true"></span>
        </label>
      </section>
      <section class="setting">
        <div class="setting-copy">
          <label class="setting-title" for="destination-select">מסך לפתיחה</label>
          <span class="setting-description">המסך שאליו יוביל כפתור +.</span>
        </div>
        <select id="destination-select" aria-label="בחירת מסך לפתיחה">
          <option value="library">הספרייה</option>
          <option value="detection">איתור מקורות</option>
        </select>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="feedback-button" class="feedback" type="button">שליחת משוב על התוסף</button>
    </main>
    <footer>יוצר התוסף: אברהם mch</footer>
  </div>
  <section id="handoff" aria-live="polite" aria-label="מעבר למסך שנבחר">
    <div class="handoff-label">מעביר<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
    <a id="handoff-link" class="handoff-link" href="otzaria://open/detection" hidden>פתיחת מסך איתור מקורות</a>
  </section>
  <script src="app.js"></script>
</body>
</html>

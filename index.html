<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>פתיחת ספרייה — אוצריא</title>
  <style>
    :root {
      color-scheme: light dark;
      --color-primary: Highlight;
      --color-on-primary: HighlightText;
      --color-surface: Canvas;
      --color-on-surface: CanvasText;
      --color-on-surface-variant: GrayText;
      --color-outline: GrayText;
      --font-ui: 'Rubik', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--color-surface);
      color: var(--color-on-surface);
      font-family: var(--font-ui);
      text-align: center;
    }

    main {
      width: min(100%, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .symbol {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      color: var(--color-primary);
    }

    .symbol svg {
      width: 68px;
      height: 68px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    p {
      max-width: 34ch;
      margin: 0;
      color: var(--color-on-surface-variant);
      font-size: 1rem;
      line-height: 1.7;
    }

    footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--color-outline);
      color: var(--color-on-surface-variant);
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 17c-7-5-15-6-24-4v34c9-2 17-1 24 4 7-5 15-6 24-4V13c-9-2-17-1-24 4Z"/>
        <path d="M32 17v34M14 22c5-.5 10 .3 14 2M50 22c-5-.5-10 .3-14 2M14 31c5-.5 10 .3 14 2M50 31c-5-.5-10 .3-14 2"/>
      </svg>
    </div>
    <h1>פתיחת ספרייה</h1>
    <p>לחיצה על כפתור + תפתח את הספרייה המקורית של אוצריא.</p>
    <footer>יוצר התוסף: אברהם mch</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>

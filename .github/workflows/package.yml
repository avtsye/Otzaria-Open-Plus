name: Package Otzaria plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check main.js

      - name: Checkout Otzaria official packager
        uses: actions/checkout@v4
        with:
          repository: Otzaria/otzaria
          path: .otzaria-packager

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packager dependencies
        working-directory: .otzaria-packager
        run: flutter pub get

      - name: Package with Otzaria official validator and packager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/.otzaria-packager"
          dart run tool/plugins/package_plugin.dart \
            "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/dist/otzaria-open-plus.otzplugin" \
            --force

      - name: Verify packaged content
        shell: python
        run: |
          import json, zipfile
          path = 'dist/otzaria-open-plus.otzplugin'
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              assert 'manifest.json' in names
              assert 'main.js' in names
              assert not any(name.endswith('.html') for name in names)
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['headless'] is True
              assert manifest['author'] == 'אברהם mch'
          print('Officially packaged plugin validated:', path)

      - name: Upload Otzaria plugin
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Open-Plus
          path: dist/*.otzplugin
          if-no-files-found: error
          retention-days: 30

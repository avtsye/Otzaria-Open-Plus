name: Package Otzaria plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check app.js

      - name: Validate manifest and required files
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest["id"] == "otzaria-open-plus"
          assert manifest["entrypoint"] == "index.html"
          assert manifest.get("headless") is not True
          assert manifest["author"] == "אברהם mch"
          assert manifest["contributes"]["background"]["entrypoint"] == "background.html"
          for path in ("index.html", "app.js", "main.js", "background.html"):
              assert Path(path).is_file(), f"Missing required file: {path}"
          print("Manifest and plugin files validated.")

      - name: Checkout Otzaria official packager
        uses: actions/checkout@v4
        with:
          repository: Otzaria/otzaria
          path: .otzaria-packager

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packager dependencies
        working-directory: .otzaria-packager
        run: flutter pub get

      - name: Package using the official packager inside Flutter test runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cat > "$GITHUB_WORKSPACE/.otzaria-packager/test/ci_package_open_plus_test.dart" <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:otzaria/plugins/services/plugin_packager.dart';

          void main() {
            test('package Open Plus with the official Otzaria validator', () async {
              final root = Platform.environment['GITHUB_WORKSPACE']!;
              final result = await PluginPackager.packDirectory(
                directoryPath: root,
                outputPath: '$root/dist/otzaria-open-plus.otzplugin',
                force: true,
              );
              expect(File(result.outputPath).existsSync(), isTrue);
              expect(result.fileCount, greaterThanOrEqualTo(4));
            });
          }
          DART
          cd "$GITHUB_WORKSPACE/.otzaria-packager"
          flutter test test/ci_package_open_plus_test.dart --reporter expanded

      - name: Verify packaged content
        shell: python
        run: |
          import json, zipfile
          path = 'dist/otzaria-open-plus.otzplugin'
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              required = {'manifest.json', 'index.html', 'app.js', 'main.js', 'background.html'}
              assert required.issubset(names), f'Missing files: {required - names}'
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest.get('headless') is not True
              assert manifest['entrypoint'] == 'index.html'
              assert manifest['author'] == 'אברהם mch'
          print('Officially packaged plugin validated:', path)

      - name: Upload Otzaria plugin
        uses: actions/upload-artifact@v4
        with:
          name: Otzaria-Open-Plus
          path: dist/*.otzplugin
          if-no-files-found: error
          retention-days: 30
